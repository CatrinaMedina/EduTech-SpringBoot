<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Gerentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container">
    <br>
    <h2>Gerentes de la base de datos</h2><br>
    <table class="table">
        <thead>
            <tr>
                <th>Id gerente</th>
                <th>Nombre gerente</th>
                <th>Apellido gerente</th>
                <th>Email gerente</th>
                <th>Especialidad gerente</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="unGerente:${gerentes}">
                <td th:text="${unGerente.id}"></td>
                <td th:text="${unGerente.nombre}"></td>
                <td th:text="${unGerente.apellido}"></td>
                <td th:text="${unGerente.email}"></td>
                <td th:text="${unGerente.especialidad}"></td>
            </tr>
        </tbody>

    </table>
</body>
</html>
