<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Feedbacks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container">
    <br>
    <h2>feedbacks de la base de datos</h2><br>
    <table class="table">
        <thead>
            <tr>
                <th>Id feedback</th>
                <th>Comentario feedback</th>
                <th>Calificacion feedback</th>
                <th>Fecha feedback</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="unFeedback:${feedbacks}">
                <td th:text="${unFeedback.id}"></td>
                <td th:text="${unFeedback.comentario}"></td>
                <td th:text="${unFeedback.calificacion}"></td>
                <td th:text="${unFeedback.fecha}"></td>
            </tr>
        </tbody>

    </table>
</body>
</html>
