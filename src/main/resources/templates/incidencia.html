<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container">
    <br>
    <h2>Incidencias de la base de datos</h2><br>
    <table class="table">
        <thead>
            <tr>
                <th>Id incidencias</th>
                <th>Descripcion incidencias</th>
                <th>Estado incidencias</th>
                <th>Fecha incidencias</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="unIncidencia:${incidencias}">
                <td th:text="${unIncidencia.id}"></td>
                <td th:text="${unIncidencia.descripcion}"></td>
                <td th:text="${unIncidencia.estado}"></td>
                <td th:text="${unIncidencia.fecha}"></td>
            </tr>
        </tbody>

    </table>
</body>
</html>
