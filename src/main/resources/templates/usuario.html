<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container">
    <br>
    <h2>Usuarios de la base de datos</h2>
    <table class="table">
        <thead>
            <tr>
                <th>Id usuario</th>
                <th>Nombre usuario</th>
                <th>Email usuario</th>
                <th>Contraseña usuario</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="unUsuario:${usuarios}">
                <td th:text="${unUsuario.id}"></td>
                <td th:text="${unUsuario.nombre}"></td>
                <td th:text="${unUsuario.email}"></td>
                <td th:text="${unUsuario.contraseña}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
