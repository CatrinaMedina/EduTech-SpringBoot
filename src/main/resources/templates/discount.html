<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Discounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container">
    <br>
    <h2>discounts de la base de datos</h2><br>
    <table class="table">
        <thead>
            <tr>
                <th>Id discount</th>
                <th>Codigo discount</th>
                <th>Porcentaje discount</th>
                <th>Fecha inicio discount</th>
                <th>Fecha fin discount</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="unDiscount:${discounts}">
                <td th:text="${unDiscount.id}"></td>
                <td th:text="${unDiscount.codigo}"></td>
                <td th:text="${unDiscount.porcentaje}"></td>
                <td th:text="${unDiscount.fechainicio}"></td>
                <td th:text="${unDiscount.fechafin}"></td>
            </tr>
        </tbody>

    </table>
</body>
</html>
